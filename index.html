<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA Contact Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--surface:#0e1219;--card:#131923;--border:#1a2235;--accent:#25d366;--accent2:#128c7e;--accent-glow:rgba(37,211,102,0.12);--text:#dde4f0;--muted:#5a6a88;--danger:#ff4d6d;--warn:#ffd60a;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 60% 30%,rgba(37,211,102,0.07) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(18,140,126,0.05) 0%,transparent 50%),var(--bg)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:52px 44px;width:420px;box-shadow:0 40px 80px rgba(0,0,0,0.6);animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.login-logo span{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-card h2{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;margin-bottom:6px}
.login-card>p{color:var(--muted);font-size:14px;margin-bottom:32px}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.field input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s,transform .15s;letter-spacing:.03em}
.btn-primary:hover{opacity:.88;transform:translateY(-1px)}
.login-err{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--danger);margin-bottom:16px;display:none}
#appPage{display:none;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:70px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(16px)}
.topbar-brand{display:flex;align-items:center;gap:12px}
.topbar-brand span{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-right{display:flex;align-items:center;gap:12px}
.clock-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 16px;display:flex;flex-direction:column;align-items:center;min-width:200px;position:relative}
.clock-row{display:flex;align-items:center;gap:10px;width:100%}
.clock-time{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--accent);letter-spacing:.05em;flex:1;text-align:center}
.clock-toggle{background:var(--border);border:none;color:var(--muted);font-size:11px;font-weight:700;font-family:'Syne',sans-serif;border-radius:6px;padding:3px 8px;cursor:pointer;transition:all .2s;white-space:nowrap}
.clock-toggle:hover,.clock-toggle.active{background:var(--accent);color:#fff}
.clock-date{font-size:11px;color:var(--muted);margin-top:2px;text-align:center;width:100%}
.clock-tz{font-size:10px;color:rgba(37,211,102,.5);text-align:center;margin-top:1px}
.tz-select{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-family:'DM Sans',sans-serif;font-size:12px;outline:none;cursor:pointer;max-width:200px}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn-logout:hover{border-color:var(--danger);color:var(--danger)}
.main{max-width:1140px;margin:0 auto;padding:32px 24px}
.section-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.msg-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:24px;display:flex;gap:14px;align-items:flex-start}
.msg-bar textarea{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;resize:vertical;min-height:56px;transition:border-color .2s}
.msg-bar textarea:focus{border-color:var(--accent)}
.msg-bar textarea::placeholder{color:var(--muted)}
.msg-icon{padding-top:12px;color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px}
.actions-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.actions-left{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-green{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:9px;padding:10px 18px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .2s,transform .15s;white-space:nowrap}
.btn-green:hover{opacity:.85;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.filter-select,.search-input{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;cursor:pointer}
.search-input{width:190px;cursor:text}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.count-badge{background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.2);color:var(--accent);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;font-family:'Syne',sans-serif;white-space:nowrap}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table-head{display:grid;grid-template-columns:2fr 2fr 1.5fr 1.2fr 130px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.contact-row{display:grid;grid-template-columns:2fr 2fr 1.5fr 1.2fr 130px;padding:15px 20px;border-bottom:1px solid var(--border);align-items:center;transition:background .15s;animation:rowIn .3s ease}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.contact-row:last-child{border-bottom:none}
.contact-row:hover{background:rgba(37,211,102,.03)}
.contact-name{font-weight:500;font-size:14px;color:var(--text)}
.contact-number{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.flag{font-size:15px}
.platform-badge{font-size:11px;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:3px 9px;display:inline-block;color:var(--muted)}
.country-text{font-size:12px;color:var(--muted)}
.row-actions{display:flex;gap:7px}
.btn-wa{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;border:none;border-radius:7px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;transition:opacity .2s,transform .1s;font-family:'DM Sans',sans-serif}
.btn-wa:hover{opacity:.82;transform:scale(1.04)}
.btn-del{background:transparent;border:1px solid rgba(255,77,109,.25);color:var(--danger);border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer;transition:all .2s}
.btn-del:hover{background:rgba(255,77,109,.1);border-color:var(--danger)}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state p{font-size:15px;margin-top:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:490px;max-width:95vw;box-shadow:0 40px 80px rgba(0,0,0,.65);transform:scale(.93) translateY(14px);transition:transform .25s ease}
.modal-overlay.open .modal{transform:scale(1) translateY(0)}
.modal h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:10px;color:var(--text)}
.modal .field{margin-bottom:16px}
.country-row{display:flex;gap:10px}
.cc-select,.modal-input{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none}
.cc-select{width:150px;cursor:pointer}
.modal-input{width:100%;transition:border-color .2s}
.modal-input:focus{border-color:var(--accent)}
.modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.btn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:10px 20px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all .2s}
.btn-cancel:hover{border-color:var(--danger);color:var(--danger)}
#fileInput{display:none}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:12px 20px;font-size:13px;font-weight:500;z-index:9999;transform:translateY(60px);opacity:0;transition:all .3s ease;max-width:280px}
.toast.show{transform:translateY(0);opacity:1}
.divider{height:1px;background:var(--border);margin:6px 0}
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="url(#lg)"/><path d="M20 8C13.37 8 8 13.37 8 20c0 2.13.55 4.14 1.52 5.88L8 32l6.3-1.49A11.94 11.94 0 0020 32c6.63 0 12-5.37 12-12S26.63 8 20 8zm6.4 16.56c-.26.74-1.52 1.38-2.08 1.46-.56.08-1.28.12-2.06-.13-.48-.15-1.1-.35-1.9-.69-3.34-1.44-5.52-4.82-5.68-5.05-.16-.23-1.3-1.73-1.3-3.3 0-1.57.82-2.34 1.12-2.66.3-.32.65-.4.87-.4h.62c.2 0 .47-.07.73.56.27.65.92 2.24.99 2.4.08.16.13.35.03.56-.1.22-.15.35-.3.54-.15.19-.32.42-.45.57-.15.17-.31.35-.13.68.18.33.8 1.32 1.72 2.13 1.18 1.05 2.18 1.38 2.51 1.54.33.16.52.13.72-.08.2-.21.85-.99 1.07-1.33.22-.34.44-.28.74-.17.3.11 1.9.9 2.23 1.06.33.16.55.24.63.37.08.13.08.78-.18 1.52z" fill="white"/><defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#25d366"/><stop offset="1" stop-color="#128c7e"/></linearGradient></defs></svg>
      <span>WA Manager</span>
    </div>
    <h2>Welcome back</h2>
    <p>Sign in to manage your contacts</p>
    <div class="login-err" id="loginErr">Incorrect number or password. Try again.</div>
    <div class="field"><label>Phone Number</label><input type="text" id="loginNum" placeholder="1234567890" autocomplete="off"/></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="off"/></div>
    <button class="btn-primary" onclick="doLogin()">Sign In →</button>
  </div>
</div>

<div id="appPage">
  <div class="topbar">
    <div class="topbar-brand">
      <svg width="30" height="30" viewBox="0 0 40 40"><rect width="40" height="40" rx="8" fill="url(#lg2)"/><path d="M20 8C13.37 8 8 13.37 8 20c0 2.13.55 4.14 1.52 5.88L8 32l6.3-1.49A11.94 11.94 0 0020 32c6.63 0 12-5.37 12-12S26.63 8 20 8zm6.4 16.56c-.26.74-1.52 1.38-2.08 1.46-.56.08-1.28.12-2.06-.13-.48-.15-1.1-.35-1.9-.69-3.34-1.44-5.52-4.82-5.68-5.05-.16-.23-1.3-1.73-1.3-3.3 0-1.57.82-2.34 1.12-2.66.3-.32.65-.4.87-.4h.62c.2 0 .47-.07.73.56.27.65.92 2.24.99 2.4.08.16.13.35.03.56-.1.22-.15.35-.3.54-.15.19-.32.42-.45.57-.15.17-.31.35-.13.68.18.33.8 1.32 1.72 2.13 1.18 1.05 2.18 1.38 2.51 1.54.33.16.52.13.72-.08.2-.21.85-.99 1.07-1.33.22-.34.44-.28.74-.17.3.11 1.9.9 2.23 1.06.33.16.55.24.63.37.08.13.08.78-.18 1.52z" fill="white"/><defs><linearGradient id="lg2" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#25d366"/><stop offset="1" stop-color="#128c7e"/></linearGradient></defs></svg>
      <span>WA Manager Pro</span>
    </div>
    <div class="topbar-right">
      <select class="tz-select" id="tzSelect" onchange="onTzChange()"></select>
      <div class="clock-box">
        <div class="clock-row">
          <div class="clock-time" id="clockTime">--:--:--</div>
          <div style="display:flex;flex-direction:column;gap:3px">
            <button class="clock-toggle" id="btn12" onclick="setFmt(12)">12H</button>
            <button class="clock-toggle" id="btn24" onclick="setFmt(24)">24H</button>
          </div>
        </div>
        <div class="clock-date" id="clockDate"></div>
        <div class="clock-tz" id="clockTz"></div>
      </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="main">
    <div class="msg-bar">
      <div class="msg-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#25d366" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.05em">MSG</span>
      </div>
      <textarea id="msgTemplate" placeholder="Type your WhatsApp message template here… Click WA on any contact to open chat with this message pre-filled."></textarea>
    </div>

    <div class="actions-row">
      <div class="actions-left">
        <button class="btn-green" onclick="openAddModal()">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="white" stroke-width="2.2" stroke-linecap="round"/></svg>
          Add Contact
        </button>
        <button class="btn-outline" onclick="document.getElementById('fileInput').click()">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M16 8l-4-4-4 4M12 4v12" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Import CSV
        </button>
        <input type="file" id="fileInput" accept=".csv,.txt" onchange="importFile(event)"/>
        <select class="filter-select" id="countryFilter" onchange="renderContacts()">
          <option value="">🌍 All Countries</option>
        </select>
        <input class="search-input" id="searchInput" placeholder="🔍 Search…" oninput="renderContacts()"/>
      </div>
      <span class="count-badge" id="countBadge">0 Contacts</span>
    </div>

    <div class="table-wrap">
      <div class="table-head">
        <div>Agency / Name</div>
        <div>Number</div>
        <div>Platform</div>
        <div>Country</div>
        <div>Actions</div>
      </div>
      <div id="contactList"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="#25d366" stroke-width="1.5"/><path d="M10 6v8M6 10h8" stroke="#25d366" stroke-width="1.5" stroke-linecap="round"/></svg>
      Add New Contact
    </h3>
    <div class="field"><label>Agency Name / Username</label><input type="text" id="f_name" placeholder="e.g. Acme Corp or @johnsmith" class="modal-input"/></div>
    <div class="field">
      <label>Phone Number</label>
      <div class="country-row">
        <select class="cc-select" id="f_cc"></select>
        <input type="text" id="f_num" placeholder="9876543210" class="modal-input"/>
      </div>
    </div>
    <div class="field"><label>Platform</label><input type="text" id="f_platform" placeholder="Instagram, Telegram, LinkedIn…" class="modal-input"/></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-green" onclick="saveContact()" style="width:auto;padding:10px 28px;">Save Contact</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

let contacts=JSON.parse(localStorage.getItem('wa_contacts_pro')||'[]');
let clockFmt=parseInt(localStorage.getItem('wa_clock_fmt')||'24');
let selectedTz=localStorage.getItem('wa_tz')||COUNTRIES[0].tz;
let clockInterval=null;

function updateClock(){
  const now=new Date();
  const opts12={timeZone:selectedTz,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true};
  const opts24={timeZone:selectedTz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};
  const timeStr=now.toLocaleTimeString('en-US',clockFmt===12?opts12:opts24);
  const dateStr=now.toLocaleDateString('en-US',{timeZone:selectedTz,weekday:'long',year:'numeric',month:'short',day:'numeric'});
  const tzName=selectedTz.split('/').pop().replace(/_/g,' ');
  document.getElementById('clockTime').textContent=timeStr;
  document.getElementById('clockDate').textContent=dateStr;
  document.getElementById('clockTz').textContent='📍 '+tzName;
}

function setFmt(f){
  clockFmt=f;
  localStorage.setItem('wa_clock_fmt',f);
  document.getElementById('btn12').classList.toggle('active',f===12);
  document.getElementById('btn24').classList.toggle('active',f===24);
  updateClock();
}

function onTzChange(){
  selectedTz=document.getElementById('tzSelect').value;
  localStorage.setItem('wa_tz',selectedTz);
  updateClock();
}

function populateTzSelect(){
  const sel=document.getElementById('tzSelect');
  sel.innerHTML='';
  COUNTRIES.forEach(c=>{
    const opt=document.createElement('option');
    opt.value=c.tz;
    opt.textContent=c.flag+' '+c.name;
    if(c.tz===selectedTz)opt.selected=true;
    sel.appendChild(opt);
  });
}

function doLogin(){
  const n=document.getElementById('loginNum').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  if(n===CREDS.num&&p===CREDS.pass){
    document.getElementById('loginPage').style.display='none';
    document.getElementById('appPage').style.display='block';
    initApp();
  }else{
    document.getElementById('loginErr').style.display='block';
  }
}
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function doLogout(){
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('appPage').style.display='none';
  document.getElementById('loginNum').value='';
  document.getElementById('loginPass').value='';
  document.getElementById('loginErr').style.display='none';
  clearInterval(clockInterval);
}

function initApp(){
  populateTzSelect();
  populateCCSelect();
  populateCountryFilter();
  renderContacts();
  setFmt(clockFmt);
  updateClock();
  clockInterval=setInterval(updateClock,1000);
}

function populateCCSelect(){
  const sel=document.getElementById('f_cc');
  sel.innerHTML='';
  COUNTRIES.forEach((c,i)=>{
    const opt=document.createElement('option');
    opt.value=i;
    opt.textContent=c.flag+' '+c.dial;
    sel.appendChild(opt);
  });
}

function populateCountryFilter(){
  const sel=document.getElementById('countryFilter');
  while(sel.options.length>1)sel.remove(1);
  const used=new Set(contacts.map(c=>c.countryCode));
  COUNTRIES.filter(c=>used.has(c.code)).forEach(c=>{
    const opt=document.createElement('option');
    opt.value=c.code;
    opt.textContent=c.flag+' '+c.name;
    sel.appendChild(opt);
  });
}

function renderContacts(){
  const fc=document.getElementById('countryFilter').value;
  const q=document.getElementById('searchInput').value.toLowerCase();
  let list=contacts;
  if(fc)list=list.filter(c=>c.countryCode===fc);
  if(q)list=list.filter(c=>c.name.toLowerCase().includes(q)||c.number.includes(q)||(c.platform||'').toLowerCase().includes(q));
  document.getElementById('countBadge').textContent=list.length+' Contact'+(list.length!==1?'s':'');
  const el=document.getElementById('contactList');
  if(!list.length){
    el.innerHTML='<div class="empty-state"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".3"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke-linecap="round" stroke-linejoin="round"/></svg><p>No contacts yet — add one or import CSV.</p></div>';
    return;
  }
  el.innerHTML=list.map(c=>{
    const country=COUNTRIES.find(x=>x.code===c.countryCode)||{flag:'🌍',name:'Unknown'};
    const fullNum=(c.dialCode+c.number).replace(/\s/g,'').replace('+','');
    const msg=encodeURIComponent(document.getElementById('msgTemplate').value||'');
    const waUrl='https://wa.me/'+fullNum+(msg?'?text='+msg:'');
    const idx=contacts.indexOf(c);
    return`<div class="contact-row">
      <div class="contact-name">${esc(c.name)}</div>
      <div class="contact-number"><span class="flag">${country.flag}</span><span>${c.dialCode} ${c.number}</span></div>
      <div><span class="platform-badge">${esc(c.platform)||'—'}</span></div>
      <div class="country-text">${country.flag} ${country.name}</div>
      <div class="row-actions">
        <a href="${waUrl}" target="_blank" style="text-decoration:none"><button class="btn-wa"><svg width="12" height="12" viewBox="0 0 20 20" fill="white"><path d="M10 2C5.58 2 2 5.58 2 10c0 1.52.42 2.95 1.14 4.18L2 18l3.95-1.1A8 8 0 1010 2zm4.56 11.47c-.19.54-1.1 1-1.5 1.06-.4.06-.93.09-1.49-.09-.35-.11-.8-.26-1.37-.5-2.41-1.04-3.99-3.48-4.11-3.64-.12-.17-.94-1.25-.94-2.38 0-1.14.6-1.69.81-1.92.22-.23.47-.29.63-.29h.45c.14 0 .34-.05.53.4.19.47.66 1.62.72 1.74.06.12.09.25.02.4-.07.16-.11.25-.22.39-.11.14-.23.3-.33.41-.11.12-.22.25-.09.49.13.24.58.95 1.24 1.54.85.76 1.58 1 1.82 1.11.24.11.37.09.52-.06.14-.15.61-.71.77-.96.16-.24.32-.2.54-.12.22.08 1.37.65 1.61.77.24.12.4.17.46.27.06.1.06.57-.13 1.1z"/></svg>WA</button></a>
        <button class="btn-del" onclick="deleteContact(${idx})">✕</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function openAddModal(){document.getElementById('addModal').classList.add('open');}
function closeModal(){
  document.getElementById('addModal').classList.remove('open');
  ['f_name','f_num','f_platform'].forEach(id=>document.getElementById(id).value='');
}

function saveContact(){
  const name=document.getElementById('f_name').value.trim();
  const num=document.getElementById('f_num').value.trim();
  const platform=document.getElementById('f_platform').value.trim();
  const ci=parseInt(document.getElementById('f_cc').value);
  const c=COUNTRIES[ci];
  if(!name||!num){showToast('⚠️ Name and number required!',true);return;}
  contacts.push({name,number:num,dialCode:c.dial,countryCode:c.code,platform});
  saveData();closeModal();showToast('✅ Contact saved!');
}

function deleteContact(idx){
  contacts.splice(idx,1);
  saveData();showToast('🗑️ Contact deleted');
}

function saveData(){
  localStorage.setItem('wa_contacts_pro',JSON.stringify(contacts));
  populateCountryFilter();renderContacts();
}

function importFile(e){
  const file=e.target.files[0];if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  const reader=new FileReader();
  reader.onload=ev=>{
    if(ext==='csv'||ext==='txt')parseCSV(ev.target.result);
    else showToast('⚠️ Use CSV or TXT file',true);
  };
  reader.readAsText(file);
  e.target.value='';
}

function parseCSV(text){
  const lines=text.trim().split('\n');
  let added=0;
  lines.forEach((line,i)=>{
    if(i===0&&line.toLowerCase().includes('name'))return;
    const parts=line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
    if(parts.length<2)return;
    const name=parts[0],rawNum=parts[1]||'',platform=parts[2]||'';
    let dial='+91',cc='IN',number=rawNum;
    COUNTRIES.forEach(c=>{
      if(rawNum.startsWith(c.dial)){dial=c.dial;cc=c.code;number=rawNum.slice(c.dial.length);}
    });
    if(name){contacts.push({name,number,dialCode:dial,countryCode:cc,platform});added++;}
  });
  saveData();showToast('✅ Imported '+added+' contacts!');
}

function showToast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=err?'var(--danger)':'var(--accent)';
  t.style.color=err?'var(--danger)':'var(--accent)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

document.getElementById('addModal').addEventListener('click',function(e){if(e.target===this)closeModal();});
